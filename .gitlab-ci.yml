stages:
  - quality
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

default:
  image: python:3.12
  interruptible: true
  cache:
    key: "pip-precommit-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
      - .cache/pre-commit

variables:
  # Dev tooling versions: pre-commit 4.5.1, ruff 0.15.6 (pyproject.toml + uv.lock)
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SAST_EXCLUDED_PATHS: "spec,test,tests,tmp,venv,.venv,.git,.cache"
  SECRET_DETECTION_EXCLUDED_PATHS: "spec,test,tests,tmp,venv,.venv,.cache"

precommit:
  stage: quality
  before_script:
    - python -m pip install --upgrade pip
    - pip install uv --quiet
    - uv sync --group dev --frozen --no-install-project
  script:
    - uv run pre-commit run ruff --all-files --show-diff-on-failure 2>&1 | tee pre-commit-report.txt
    - uv run pre-commit run ruff-format --all-files --show-diff-on-failure 2>&1 | tee -a pre-commit-report.txt
  artifacts:
    when: always
    paths:
      - pre-commit-report.txt
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
