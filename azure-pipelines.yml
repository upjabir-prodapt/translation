trigger:
  branches:
    include:
      - sandbox-ui

pool:
  vmImage: ubuntu-latest

variables:
  - ${{ if or(eq(variables['Build.SourceBranchName'], 'sandbox'), eq(variables['Build.SourceBranchName'], 'sandbox-ui')) }}:
      - group: translation-sandbox
  - ${{ if eq(variables['Build.SourceBranchName'], 'dev')}}:
      - group: translation-dev
  - ${{ if eq(variables['Build.SourceBranchName'], 'prod')}}:
      - group: translation-prod
  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: '$(Pipeline.Workspace)/.workload_identity.wlconfig'
  - name: ROOT
    value: '$(Build.SourcesDirectory)'  

stages:
# ============================================================================
