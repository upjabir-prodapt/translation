[babeldoc]
# ============================================
# REQUIRED SETTINGS
# ============================================
# Translation service (required)
openai = true

# OpenAI API key (required when using OpenAI)
openai-api-key = "your-api-key-here"

# Input files to translate (required)
files = ["/path/to/your/document.pdf"]

# ============================================
# COMMON SETTINGS
# ============================================
lang-in = "en"
lang-out = "zh"
qps = 4
min-text-length = 5
report-interval = 0.1

# Translation behavior
no-dual = false
no-mono = false
ignore-cache = false
split-short-lines = false
short-line-split-factor = 0.8
skip-clean = false
dual-translate-first = false
disable-rich-text-translate = false
enhance-compatibility = false
use-alternating-pages-dual = false
watermark-output-mode = "watermarked"
translate-table-text = false
show-char-box = false
skip-scanned-detection = false
ocr-workaround = false
add-formula-placehold-hint = false
disable-same-text-fallback = false
auto_extract_glossary = true
auto_enable_ocr_workaround = false
only-include-translated-page = false
save-auto-extracted-glossary = false
disable-graphic-element-process = false
merge-alternating-line-numbers = true
skip-translation = false
skip-form-render = false
skip-curve-render = false
only-parse-generate-pdf = false
remove-non-formula-lines = false
non-formula-line-iou-threshold = 0.9
figure-table-protection-threshold = 0.9
skip-formula-offset-calculation = false

# OpenAI
openai-model = "gpt-4o-mini"
enable-json-mode-if-requested = false
send-dashscope-header = false
no-send-temperature = false

# Optional values to set per environment/job
# openai-base-url = "https://api.openai.com/v1"
# openai-api-key = "<your-api-key>"
# pages = "1-"
# files = ["/absolute/path/to/file.pdf"]
# output = "/absolute/path/to/output"
# working-dir = "/absolute/path/to/working"
# glossary-files = "/path/g1.csv,/path/g2.csv"
# primary-font-family = "serif"
# max-pages-per-part = 50
