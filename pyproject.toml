[project]
name = "translation-api"
version = "0.5.23"
description = "PDF translation API and Cloud Tasks worker (DocTranslator)"
license = "MIT"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["PDF", "translation", "cloud-run"]
# Base / API image dependencies (no DocTranslator / ONNX / LLM SDKs).
dependencies = [
    "protobuf>=4.30.0,<6",
    "httpx[socks]>=0.27.0",
    "orjson>=3.10.14",
    "charset-normalizer >= 2.0.0",
    "cryptography>=46.0.7",
    "pymupdf>=1.25.1",
    "pydantic>=2.10.6",
    "tenacity>=9.0.0",
    "google-cloud-storage>=2.10.0",
    "google-cloud-firestore>=2.20.0",
    "redis[hiredis]>=5.0.0",
    "python-dotenv>=1.2.2",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-tasks>=2.23.0",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-semantic-conventions>=0.62b1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "opentelemetry-instrumentation-logging>=0.62b1",
    "opentelemetry-resourcedetector-gcp>=1.12.0a0",
    "google-auth>=2.53",
    "pydantic-settings>=2.13.1",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "python-multipart>=0.0.27",
    "PyJWT[crypto]>=2.12.1",
    "urllib3>=2.7.0",
    "idna>=3.12",
    "pyasn1>=0.6.3",
    "requests>=2.33.0",
]

[project.optional-dependencies]
# Worker Cloud Run + local in-process pipeline / full test suite.
worker = [
    "bitstring>=4.3.0",
    "numpy>=2.0.2",
    "onnx>=1.21.0",
    "onnxruntime>=1.16.1",
    "psutil>=7.0.0",
    "rich>=13.9.4",
    "tqdm>=4.67.1",
    "xsdata[cli,lxml,soap]>=24.12",
    "scikit-image>=0.25.2",
    "freetype-py>=2.5.1",
    "tiktoken>=0.9.0",
    "Levenshtein>=0.27.1",
    "opencv-python-headless>=4.10.0.84",
    "rapidocr-onnxruntime>=1.4.4",
    "pyzstd>=0.17.0",
    "hyperscan>=0.7.13",
    "rtree>=1.4.0",
    "chardet>=5.2.0",
    "scikit-learn>=1.7.1",
    "opentelemetry-instrumentation-google-genai>=0.7b1",
    "google-genai>=1.67.0",
    "anthropic[vertex]>=0.40.0",
    "lingua-language-detector>=2.2.0",
    "gitpython>=3.1.49",
    "lxml>=6.1.0",
    "pillow>=12.2.0",
    "google-cloud-dlp>=3.22.0",
    "python-docx>=1.1.2",
]

# Alias for Dockerfile.api clarity (installs base deps; no worker wheels).
api = [
    "pymupdf>=1.25.1",
]
directml = ["onnxruntime-directml>=1.16.1"]
cuda = ["onnxruntime-gpu>=1.16.1"]
memray = ["memray>=1.17.1"]

[tool.flake8]
ignore = ["E203", "E261", "E501", "W503", "E741", "E501"]
max-line-length = 88

[tool.ruff]
src = ["src"]
target-version = "py312"
show-fixes = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
    "E203",
    "E261",
    "E501",
    "E741",
    "F841",
    "C901",
    "S101",
    "SIM",
    "ARG002",
    "S110",
    "B024",
    "S112",
    "COM812",
]
select = [
    "E",
    "F",
    "N",
    "B",
    "I",
    "C",
    "UP",
    "S",
    "A",
    "COM",
    "ARG",
    "PTH",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/worker/doctranslator/doctranslator_exception/DocTranslatorException.py" = ["N999"]
"src/worker/doctranslator/format/pdf/pdfinterp.py" = ["N"]
"tests/*" = ["S101"]
"**/__init__.py" = ["F401"]
"src/worker/doctranslator/format/pdf/document_il/midend/paragraph_finder.py" = ["S311"]
"docs/*" = ["A001"]
"src/worker/doctranslator/pdfminer/*" = ["A", "F", "I", "N", "S", "B", "C", "COM", "ARG", "PTH", "UP"]

[dependency-groups]
dev = [
    "bumpver>=2024.1130",
    "markdown-callouts>=0.4.0",
    "markdown-include>=0.8.1",
    "mkdocs-git-authors-plugin>=0.9.2",
    "mkdocs-git-committers-plugin-2>=2.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-material[recommended]>=9.6.4",
    "pymdown-extensions>=10.21",
    "pre-commit==4.5.1",
    "pygments>=2.20.0",
    "ruff==0.15.6",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "py-spy>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["src"]
relative_files = true
omit = [
    "src/worker/doctranslator/*",
    "src/worker/doctranslator/**/*",
    "src/worker/loaders/*",
    "src/worker/loaders/**/*",
]

[tool.coverage.report]
omit = [
    "src/worker/doctranslator/*",
    "src/worker/doctranslator/**/*",
    "src/worker/loaders/*",
    "src/worker/loaders/**/*",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[bumpver]
current_version = "0.5.23"
version_pattern = "MAJOR.MINOR.PATCH[.PYTAGNUM]"

[bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "off"
reportGeneralTypeIssues = false
reportUnknownVariableType = false
reportMissingParameterType = false
reportUnknownParameterType = false
